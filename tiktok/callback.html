<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorization complete</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;font-size:15px}button{margin-top:12px;padding:10px 18px;font-size:16px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer}</style></head><body>
<h1>허락 완료 / Authorization complete</h1>
<p id="msg">아래 코드를 복사해 총괄 창에 붙여 넣어 주세요. 이 페이지는 코드를 어디에도 보내지 않습니다.</p>
<code id="code">-</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent).then(()=>{this.textContent='복사됨'})">코드 복사</button>
<script>
const q=new URLSearchParams(location.search);
if(q.get('error')){document.getElementById('msg').textContent='허락이 취소되었거나 오류가 났습니다: '+q.get('error')+' '+(q.get('error_description')||'');}
document.getElementById('code').textContent=(q.get('code')||'-')+(q.get('state')?'  state='+q.get('state'):'');
</script>
</body></html>
